# Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ---------------------------------------------------------------------------
# SUMBER TUNGGAL KONFIGURASI & VERSI
# ---------------------------------------------------------------------------
# Semua nilai di bawah dibaca oleh plugin `dev.nyawit.buildconfig` (build-logic),
# lalu dibagikan ke Android, desktop, dan UI lewat BuildConfig.kt yang dihasilkan
# di source set commonMain. Untuk rilis, CI menimpa nilai lewat
# -PreleaseVersion=... -PandroidVersionCode=...
# ---------------------------------------------------------------------------

# Versi aplikasi (X.Y.Z)
releaseVersion=1.3.3
androidVersionCode=10303

# Identitas aplikasi
appId=dev.nyawit.launcher
appName=Nyawit Launcher
appVendor=Nyawit
appDescription=Launcher Kotlin Multiplatform untuk Android, Android TV, dan desktop.
appCopyright=\u00a9 2026 Nyawit. All rights reserved.

# Identitas paket desktop
desktopPackageName=nyawit-launcher
desktopMainClass=dev.nyawit.launcher.MainKt

# Sumber data GitHub & katalog
githubOwner=nyawit-dev
githubRepo=nyawit-launcher
githubBranch=main
githubApiUrl=https://api.github.com
catalogUrl=https://raw.githubusercontent.com/nyawit-dev/nyawit-launcher/main/catalog.json

# Level SDK & toolchain
androidCompileSdk=37
androidCompileSdkMinor=1
androidMinSdk=26
androidTargetSdk=37
jvmToolchain=21
