name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build Android and JVM
        run: ./gradlew --no-daemon :androidApp:assembleDebug :desktopApp:desktopJar --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nyawit-launcher-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
      - name: Upload JVM jar
        uses: actions/upload-artifact@v4
        with:
          name: nyawit-launcher-jvm
          path: desktopApp/build/libs/*.jar
