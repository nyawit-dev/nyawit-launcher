name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build Android and desktop
        run: ./gradlew --no-daemon :androidApp:assembleDebug :desktopApp:packageDistributionForCurrentOS --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nyawit-launcher-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: nyawit-launcher-desktop
          path: |
            desktopApp/build/compose/binaries/**/*.deb
            desktopApp/build/compose/binaries/**/*.rpm
