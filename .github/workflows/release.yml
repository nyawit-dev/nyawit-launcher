name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

concurrency:
  group: nyawit-launcher-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
      - run: chmod +x gradlew
      - name: Build Android release APK
        run: ./gradlew --no-daemon :androidApp:assembleRelease --stacktrace
      - name: Verify Android TV launcher category
        shell: bash
        run: |
          APK=$(find androidApp/build/outputs/apk/release -name '*.apk' -type f | head -n1)
          test -n "$APK" || { echo "::error::No release APK"; exit 1; }
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | head -n1)
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -i 'LEANBACK_LAUNCHER' || {
            echo "::error::Android TV launcher category missing"; exit 1;
          }
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: androidApp/build/outputs/apk/release/*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            native_task: ':desktopApp:packageDistributionForCurrentOS'
          - os: windows-latest
            name: windows
            native_task: ':desktopApp:packageDistributionForCurrentOS'
          - os: macos-latest
            name: mac
            native_task: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x gradlew
      - name: Build JVM artifacts for ${{ matrix.name }}
        shell: bash
        run: ./gradlew --no-daemon :desktopApp:packageUberJarForCurrentOS ${{ matrix.native_task }} --stacktrace
      - name: Collect JVM artifacts
        shell: bash
        run: |
          mkdir -p dist-${{ matrix.name }}
          find desktopApp/build -type f \( -name 'nyawit-launcher-*.jar' -o -name '*.deb' -o -name '*.msi' -o -name '*.dmg' -o -name '*.zip' \) -exec cp {} dist-${{ matrix.name }}/ \;
          APP_DIR=$(find desktopApp/build/compose/binaries -maxdepth 5 -type d -name 'nyawit-launcher*' -print -quit || true)
          if [ -n "$APP_DIR" ]; then
            (
              if [ "${{ runner.os }}" = "Windows" ]; then
                powershell -Command "Compress-Archive -Path '$APP_DIR' -DestinationPath 'dist-${{ matrix.name }}/nyawit-launcher-${{ matrix.name }}-portable.zip'"
              else
                cd "$(dirname "$APP_DIR")" && zip -qr "$GITHUB_WORKSPACE/dist-${{ matrix.name }}/nyawit-launcher-${{ matrix.name }}-portable.zip" "$(basename "$APP_DIR")"
              fi
            ) || echo "::warning::Portable zip dilewati"
          fi
          ls -lh dist-${{ matrix.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist-${{ matrix.name }}/*

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List release artifacts
        run: ls -lh dist/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
