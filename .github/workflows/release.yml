name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (format vX.Y.Z, mis. v1.3.1)'
        required: false
        default: 'v1.3.1'
        type: string

permissions:
  contents: write

concurrency:
  group: nyawit-launcher-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag harus berformat vX.Y.Z (mis. v1.3.1), got: $TAG"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release dengan tag $TAG sudah ada"
            exit 1
          fi
          echo "Tag $TAG valid"

  android:
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
      - run: chmod +x gradlew
      - name: Resolve version from tag
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=$((10#$MAJOR)); MINOR=$((10#$MINOR)); PATCH=$((10#$PATCH))
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_ENV"
          echo "Building Android $VERSION (code $ANDROID_VERSION_CODE)"
      - name: Build Android release APK
        run: >-
          ./gradlew --no-daemon :androidApp:assembleRelease
          -PreleaseVersion=$RELEASE_VERSION
          -PandroidVersionCode=$ANDROID_VERSION_CODE
          --stacktrace
      - name: Verify Android TV launcher category
        shell: bash
        run: |
          APK=$(find androidApp/build/outputs/apk/release -name '*.apk' -type f | head -n1)
          test -n "$APK" || { echo "::error::No release APK"; exit 1; }
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | head -n1)
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -i 'LEANBACK_LAUNCHER' || {
            echo "::error::Android TV launcher category missing"; exit 1;
          }
      - name: Verify APK signature and version
        shell: bash
        run: |
          APK=$(find androidApp/build/outputs/apk/release -name '*.apk' -type f | head -n1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -n1)
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" || { echo "::error::APK signature invalid"; exit 1; }
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | head -n1)
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -q "versionCode='$ANDROID_VERSION_CODE'" || {
            echo "::error::APK versionCode tidak sesuai tag"; exit 1;
          }
          echo "$BADGING" | grep -q "versionName='$RELEASE_VERSION'" || {
            echo "::error::APK versionName tidak sesuai tag"; exit 1;
          }
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: androidApp/build/outputs/apk/release/*.apk

  desktop:
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            native_task: ':desktopApp:packageDistributionForCurrentOS'
          - os: windows-latest
            name: windows
            native_task: ':desktopApp:packageDistributionForCurrentOS'
          - os: macos-15-intel
            name: mac-x64
            native_task: ':desktopApp:packageDistributionForCurrentOS'
          - os: macos-latest
            name: mac-arm64
            native_task: ':desktopApp:packageDistributionForCurrentOS'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x gradlew
      - name: Install Linux packaging tools
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Resolve version from tag
        shell: bash
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          echo "RELEASE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Build native installer for ${{ matrix.name }}
        shell: bash
        run: >-
          ./gradlew --no-daemon ${{ matrix.native_task }}
          -PreleaseVersion=$RELEASE_VERSION
          --stacktrace
      - name: Collect native installer
        shell: bash
        run: |
          set -e
          OUT="dist-${{ matrix.name }}"
          mkdir -p "$OUT"
          # Abaikan direktori app-image (bukan installer) agar tidak ikut dirilis.
          find desktopApp/build/compose/binaries/main \
            -path '*/app/*' -prune -o \
            -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.dmg' \) \
            -exec cp {} "$OUT"/ \;
          test -n "$(ls -A "$OUT")" || { echo "::error::Tidak ada installer native untuk ${{ matrix.name }}"; exit 1; }
          # Awali nama dengan platform agar artifact macOS x64/arm64 tidak saling menimpa.
          for f in "$OUT"/*; do
            [ -f "$f" ] || continue
            mv "$f" "$OUT/${{ matrix.name }}-$(basename "$f")"
          done
          ls -lh "$OUT"/
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist-${{ matrix.name }}/*


  inno-windows:
    name: Inno Setup Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Resolve version from tag
        shell: bash
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          echo "RELEASE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Generate wizard art
        shell: bash
        run: node scripts/generate_wizard_art.js
      - name: Build Windows app image
        shell: bash
        run: ./gradlew --no-daemon :desktopApp:createDistributable -PreleaseVersion=$RELEASE_VERSION --stacktrace
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compile comic wizard installer
        shell: pwsh
        run: |
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          ISCC.exe /DMyAppVersion=$env:RELEASE_VERSION installer\windows\nyawit-launcher.iss
      - uses: actions/upload-artifact@v4
        with:
          name: inno-windows
          path: installer/windows/Output/*.exe
          if-no-files-found: error

  publish:
    needs: [android, desktop, inno-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue;; esac
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done
          ls -lh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
